<script>try{if(localStorage.getItem('tmko:in')==='1')document.documentElement.classList.add('is-returning')}catch(e){}</script>

<style>
  :root {
    --oy-red:        #E8412A;
    --oy-red-deep:   #C8341F;
    --oy-red-soft:   #F4B8AC;

    --oy-cream:      #F2E8D5;
    --oy-cream-soft: #EADFC8;
    --oy-cream-warm: #F7F0E0;

    --oy-ink:        #1C1917;
    --oy-ink-soft:   #3B3430;
    --oy-mute:       #6B625B;
    --oy-hairline:   #C8BCA3;

    --oy-font-display: 'Archivo Black', 'Impact', sans-serif;
    --oy-font-body:    'DM Sans', system-ui, -apple-system, sans-serif;
    --oy-font-jp:      'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
    --oy-font-mono:    'JetBrains Mono', ui-monospace, monospace;

    --oy-radius-xs: 2px;
    --oy-radius-sm: 4px;
    --oy-radius-md: 6px;
    --oy-radius-lg: 10px;
    --oy-radius-pill: 999px;

    --oy-ease: cubic-bezier(.2,.7,.2,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--oy-red);
    color: var(--oy-ink);
    font-family: var(--oy-font-body);
    -webkit-font-smoothing: antialiased;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  :focus-visible { outline: 2px solid var(--oy-red); outline-offset: 2px; }

  .oy-frame {
    position: relative;
    width: 100%;
    max-width: 1320px;
    background: var(--oy-cream);
    border-radius: 10px;
    padding: 32px 52px 28px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.35);
  }
  .oy-frame::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1.5px solid var(--oy-red);
    border-radius: 6px;
    pointer-events: none;
  }

  /* ============ Semantic type ============ */
  .oy-h1 {
    font-family: var(--oy-font-display);
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .oy-kana {
    font-family: var(--oy-font-jp);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--oy-red);
  }
  .oy-lede {
    font-family: var(--oy-font-body);
    font-size: 17px;
    line-height: 1.55;
    color: var(--oy-ink-soft);
  }
  .oy-meta {
    font-family: var(--oy-font-body);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--oy-mute);
  }
  .stamp {
    display: inline-block;
    border: 1.5px solid var(--oy-ink);
    padding: 4px 12px;
    font-family: var(--oy-font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* ============ Primitives ============ */
  .oy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 34px;
    background: var(--oy-red);
    color: var(--oy-cream);
    border: none;
    font-family: var(--oy-font-body);
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    border-radius: var(--oy-radius-xs);
    cursor: pointer;
    position: relative;
    top: 0; left: 0;
    transition: top 120ms var(--oy-ease), left 120ms var(--oy-ease), background 200ms var(--oy-ease);
  }
  .oy-btn::before {
    content: "";
    position: absolute;
    inset: -6px -6px 6px 6px;
    border: 1.5px solid var(--oy-ink);
    border-radius: var(--oy-radius-xs);
    z-index: -1;
  }
  /* Nudge with top/left, not transform/opacity: those would make the button its own
     stacking context and the offset outline would paint over its face. */
  .oy-btn:hover  { background: var(--oy-red-deep); top: -1px; left: -1px; }
  .oy-btn:active { top: 1px; left: 1px; }
  .oy-btn:disabled { background: var(--oy-red-deep); cursor: wait; top: 0; left: 0; }

  .oy-btn-small {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 36px;
    padding: 8px 14px;
    background: transparent;
    border: 1.5px solid var(--oy-ink);
    font-family: var(--oy-font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, color .2s;
    color: var(--oy-ink);
  }
  .oy-btn-small:hover { background: var(--oy-ink); color: var(--oy-cream); }

  /* ============ Nav (same links as the main site) ============ */
  .oy-nav {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 4px 12px 0;
  }
  .oy-logo {
    flex: none;
    display: inline-flex;
    align-items: center;
    line-height: 1;
  }
  .oy-logo img {
    display: block;
    height: clamp(28px, 2.8vw, 40px);
    width: auto;
  }
  .oy-nav-links {
    display: flex;
    gap: 44px;
    list-style: none;
    font-size: 15px;
    font-weight: 500;
  }
  .oy-nav-links a {
    position: relative;
    color: var(--oy-ink-soft);
    text-decoration: none;
    white-space: nowrap;
    padding: 4px 0;
    transition: color .2s var(--oy-ease);
  }
  .oy-nav-links a:hover { color: var(--oy-red); }
  .oy-nav-links li.on a { color: var(--oy-ink); }
  .oy-nav-links li.on a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
    height: 1.5px; background: var(--oy-red);
  }

  /* ============ Lock screen ============ */
  .oy-hero {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: center;
    padding: 24px 12px 16px;
  }
  #gate { flex: 1; }
  .oy-hero-headline { font-size: clamp(34px, 4.5vw, 48px); line-height: 1.05; }
  .oy-hero-headline .accent { color: var(--oy-red); display: block; }
  .oy-cta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; margin-top: 28px; }
  .oy-art-wrap {
    position: relative;
    aspect-ratio: 1/1;
    width: 100%;
    max-width: 480px;
    margin-left: auto;
    display: grid;
    place-items: center;
  }
  .oy-scene { width: 100%; height: 100%; object-fit: contain; display: block; }
  .oy-wavy { margin: 14px 0 18px; color: var(--oy-ink); display: block; }

  .boot {
    display: none;
    flex: 1;
    place-items: center;
    font-family: var(--oy-font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--oy-mute);
  }
  .is-returning #gate { display: none; }
  .is-returning .boot { display: grid; }

  /* Password field: same underline field as the registration form */
  .gate-form { margin-top: 28px; max-width: 420px; }
  .reg-field label {
    display: block;
    font-family: var(--oy-font-mono);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--oy-mute);
    margin-bottom: 6px;
  }
  .reg-field input {
    width: 100%;
    padding: 10px 0 8px;
    border: none;
    border-bottom: 1.5px solid var(--oy-ink);
    background: transparent;
    font-family: var(--oy-font-body);
    font-size: 16px;
    color: var(--oy-ink);
    outline: none;
  }
  .reg-field input:focus, .reg-field.err input { border-color: var(--oy-red); }
  .reg-field .err-msg {
    display: none;
    color: var(--oy-red);
    font-family: var(--oy-font-mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .reg-field.err .err-msg { display: block; }

  /* ============ Header (after unlock) ============ */
  .pod { flex: 1; padding: 36px 12px 0; }
  .pod-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    padding-bottom: 22px;
    border-bottom: 1.5px solid var(--oy-red);
  }
  .pod-head .oy-kana { font-size: 22px; line-height: 1.2; }
  .pod-title {
    margin-top: 4px;
    font-family: var(--oy-font-display);
    font-weight: 400;
    font-size: clamp(30px, 3vw, 42px);
    line-height: 1.04;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .pod-sub { margin-top: 6px; font-size: 16px; line-height: 1.5; color: var(--oy-ink-soft); }
  .oy-btn-small.pod-lock { min-height: 44px; padding: 0 18px; font-size: 14px; }
  .pod-main {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 28px;
    margin-top: 32px;
  }

  /* ============ Recordings: one list, R01 down ============ */
  .ep-list {
    flex: 1 1 0;
    min-width: 0;
    list-style: none;
    background: var(--oy-cream-warm);
    border: 1.5px solid var(--oy-ink);
  }
  .ep { position: relative; display: flex; align-items: center; border-bottom: 1px solid var(--oy-hairline); }
  .ep:last-child { border-bottom: none; }
  .ep.is-current { background: var(--oy-cream); }
  .ep-btn {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
    min-height: 72px;
    padding: 12px 14px 14px 18px;
    background: transparent;
    border: none;
    font-family: var(--oy-font-body);
    color: var(--oy-ink);
    text-align: left;
    cursor: pointer;
  }
  .ep-btn:focus-visible { outline-offset: -4px; }
  .ep-icon {
    display: grid;
    place-items: center;
    width: 44px; height: 44px;
    border-radius: var(--oy-radius-pill);
    background: var(--oy-ink);
    color: var(--oy-cream);
    transition: background .2s var(--oy-ease);
  }
  .ep-icon svg { width: 18px; height: 18px; }
  .ep-btn:hover .ep-icon, .ep.is-current .ep-icon { background: var(--oy-red); }
  .ep-text { display: block; min-width: 0; }
  .ep-code {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--oy-font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--oy-mute);
  }
  .ep-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .ep-state {
    display: block;
    margin-top: 4px;
    font-family: var(--oy-font-mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--oy-mute);
  }
  .ep-state:empty { display: none; }
  .ep-dur { font-family: var(--oy-font-mono); font-size: 12px; color: var(--oy-mute); font-variant-numeric: tabular-nums; }
  .ep-dur-sm { display: none; font-weight: 500; letter-spacing: 1px; }   /* phones: duration moves up beside the code */
  /* Download: a link beside the row's play button (a link can't sit inside a button). */
  .ep-dl {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px; height: 40px;
    margin-right: 16px;
    border: 1.5px solid var(--oy-hairline);
    border-radius: var(--oy-radius-pill);
    color: var(--oy-ink-soft);
    transition: color .2s var(--oy-ease), border-color .2s var(--oy-ease);
  }
  .ep-dl svg { width: 18px; height: 18px; }
  .ep-dl:hover { color: var(--oy-red); border-color: var(--oy-red); }
  .ep-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none; }
  .ep-bar span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--oy-red); }
  .eq { display: none; align-items: flex-end; gap: 2px; height: 11px; }
  .eq i { width: 2px; height: 100%; background: var(--oy-red); transform-origin: bottom; animation: eq 900ms ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -300ms; }
  .eq i:nth-child(3) { animation-delay: -600ms; }
  .is-playing .eq { display: inline-flex; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  /* ============ Player ============ */
  /* An ink panel beside the list that stays in view while the list scrolls.
     Below 1100px it docks to the bottom of the screen instead (see the media queries). */
  .oy-dock {
    position: sticky;
    top: 24px;
    z-index: 3;
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: 26px 24px 22px;
    background: var(--oy-ink);
    color: var(--oy-cream);
  }
  .oy-dock::before {   /* offset outline, as on the Trubiki player */
    content: "";
    position: absolute;
    inset: 8px -8px -8px 8px;
    border: 1.5px solid var(--oy-ink);
    z-index: -1;
    pointer-events: none;
  }
  .oy-dock :focus-visible { outline-color: var(--oy-red-soft); }
  .dk-text { min-width: 0; }
  .dk-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--oy-font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--oy-hairline);
  }
  .dk-meta {
    margin-top: 16px;
    font-family: var(--oy-font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--oy-red-soft);
  }
  .dk-title {
    margin-top: 6px;
    font-family: var(--oy-font-display);
    font-size: clamp(22px, 2vw, 28px);
    line-height: 1.08;
    text-transform: uppercase;
  }

  /* The waveform is the seek bar: an invisible range input sits on top of it. */
  .dk-seek {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "wave wave wave" "cur . dur";
    row-gap: 8px;
  }
  .dk-time {
    min-width: 4.6ch;
    font-family: var(--oy-font-mono);
    font-size: 11px;
    color: var(--oy-hairline);
    font-variant-numeric: tabular-nums;
  }
  #tCur { grid-area: cur; }
  #tDur { grid-area: dur; text-align: right; }
  .dk-scrub { --pct: 0%; grid-area: wave; position: relative; height: 60px; }
  .dk-wave {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 3px;
    pointer-events: none;
  }
  .dk-wave i { flex: 1; min-width: 0; background: var(--oy-ink-soft); }
  .dk-wave--on { clip-path: inset(0 calc(100% - var(--pct)) 0 0); }
  .dk-wave--on i { background: var(--oy-red); }
  .dk-scrub::after {   /* playhead */
    content: "";
    position: absolute;
    top: -4px; bottom: -4px;
    left: var(--pct);
    width: 2px;
    margin-left: -1px;
    background: var(--oy-cream);
    pointer-events: none;
  }
  .oy-seek {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  /* A thin thumb keeps clicks landing where the playhead is drawn. */
  .oy-seek::-webkit-slider-runnable-track { height: 100%; }
  .oy-seek::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 2px; height: 100%; }
  .oy-seek::-moz-range-thumb { width: 2px; height: 100%; border: 0; }
  .dk-scrub:has(.oy-seek:focus-visible) { outline: 2px solid var(--oy-red-soft); outline-offset: 6px; }

  .dk-transport { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .dk-btn {
    display: inline-grid;
    place-items: center;
    flex: none;
    width: 48px; height: 48px;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: var(--oy-radius-pill);
    color: var(--oy-cream);
    cursor: pointer;
    transition: color .2s var(--oy-ease), border-color .2s var(--oy-ease), background .2s var(--oy-ease);
  }
  .dk-btn svg { width: 18px; height: 18px; }
  .dk-btn:hover { color: var(--oy-red-soft); }
  .dk-btn:disabled { opacity: .3; cursor: default; color: var(--oy-cream); }
  .dk-round { border: 1.5px solid var(--oy-hairline); }
  .dk-round:hover:not(:disabled) { border-color: var(--oy-red-soft); }
  .dk-skip { font-family: var(--oy-font-mono); font-size: 12px; font-weight: 700; }
  .dk-play { width: 68px; height: 68px; background: var(--oy-red); }
  .dk-play:hover { background: var(--oy-red-deep); color: var(--oy-cream); }
  .dk-play svg { width: 24px; height: 24px; }

  .dk-opts {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--oy-ink-soft);
  }
  .dk-chip {
    padding: 7px 12px;
    background: transparent;
    border: 1.5px solid var(--oy-hairline);
    font-family: var(--oy-font-body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--oy-cream);
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, color .2s, border-color .2s;
  }
  .dk-chip:hover { border-color: var(--oy-red-soft); color: var(--oy-red-soft); }
  .dk-chip[aria-pressed="true"] { background: var(--oy-red); border-color: var(--oy-red); color: var(--oy-cream); }

  /* ============ Footer ============ */
  .oy-footer {
    position: relative; z-index: 2;
    margin-top: 28px;
    padding: 0 12px 4px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 30px;
  }
  .oy-footer .rule { height: 1px; background: var(--oy-red); opacity: 0.8; }

  /* Below 1100px the list comes first and the player docks to the bottom of
     the screen as three short rows: now playing, the waveform, the extras. */
  @media (max-width: 1100px) {
    .pod-main { gap: 20px; }
    .ep-list { order: 1; flex-basis: 100%; }
    .oy-dock {
      order: 2;
      flex: 1 1 100%;
      top: auto;
      bottom: 12px;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 6px;
      padding: 14px 16px;
      box-shadow: 0 12px 28px -14px rgba(0,0,0,0.6);
    }
    .oy-dock::before { display: none; }
    .dk-transport, .dk-opts { display: contents; }
    .dk-text { order: 1; flex: 1 1 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
    .dk-meta { order: 1; margin-top: 0; }
    .dk-top {
      order: 2;
      display: block;
      flex: 1 1 0;
      min-width: 0;
      font-size: 10px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dk-ed { display: none; }
    .dk-title { order: 3; flex: 1 1 100%; min-width: 0; margin-top: 0; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #btnPrev { order: 2; }
    #btnPlay { order: 3; }
    #btnNext { order: 4; }
    .dk-seek { order: 5; flex: 1 1 100%; grid-template-areas: "cur wave dur"; column-gap: 12px; align-items: center; }
    .dk-scrub { height: 32px; }
    #btnBack { order: 6; }
    #btnFwd { order: 7; }
    #btnRate { order: 8; margin-left: auto; }
    #btnMode { order: 9; }
    .dk-btn { width: 44px; height: 44px; }
    .dk-play { width: 52px; height: 52px; }
  }
  @media (max-width: 1024px) {
    .oy-hero { grid-template-columns: 1fr; gap: 32px; }
    .oy-art-wrap { margin: 0 auto; max-width: 420px; }
  }
  /* The logo and four links stop fitting on one line here, so the links get their own row. */
  @media (max-width: 860px) {
    .oy-nav { flex-wrap: wrap; gap: 16px; }
    .oy-nav-links { gap: 12px 28px; flex-wrap: wrap; order: 3; width: 100%; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .oy-frame { padding: 20px 24px 20px; }
    .oy-nav-links { column-gap: 20px; }
    .oy-h1 { font-size: 36px; }
    .oy-hero-headline { font-size: clamp(24px, 8.2vw, 36px); }
    .stamp { font-size: 9px; letter-spacing: 1px; }
    .pod { padding: 28px 0 0; }
    .pod-main { margin-top: 24px; }
    .ep-btn { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 10px 14px 14px; }
    .ep-dur { display: none; }
    .ep-dur-sm { display: inline; }
    .ep-dl { width: 38px; height: 38px; margin-right: 12px; }
    .ep-title { font-size: 16px; }
    .oy-dock { padding: 12px; gap: 10px 4px; }
    .dk-text { column-gap: 8px; }
    .dk-meta { letter-spacing: 1.5px; }
    .dk-top { letter-spacing: 1px; }
    .dk-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-family: var(--oy-font-body);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.25;
      text-transform: none;
      white-space: normal;
    }
    .dk-btn { width: 38px; height: 38px; }
    .dk-play { width: 46px; height: 46px; }
    .dk-scrub { height: 28px; }
    .dk-wave i:nth-child(even) { display: none; }
  }
  /* On the narrowest phones the player drops the code to fit the status; the list still shows it. */
  @media (max-width: 374px) {
    .dk-meta { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .eq i { animation: none; transform: scaleY(.6); }
  }
</style>
</head>
<body>

<main class="oy-frame">
  <!-- ============ NAV ============ -->
  <nav class="oy-nav" aria-label="Main">

    </a>
    <ul class="oy-nav-links">

      <li><a href="https://tramokyo.johnnyneang.com/trubiki">Trubiki</a></li>
      <li class="on"><a href="/" aria-current="page">TMKO Podcast</a></li>
      <li><a href="https://photos.app.goo.gl/8gWpv26gCsv7nc1y8" target="_blank" rel="noopener noreferrer">Photo album <span aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>

  <div class="boot" id="boot">Loading</div>

  <!-- ============ LOCK SCREEN ============ -->
  <section class="oy-hero" id="gate">
    <div class="oy-hero-copy">
      <span class="stamp">Listening Edition 01 · Invitation only</span>
      <div class="oy-kana" style="font-size:38px" lang="ja">合言葉</div>
      <svg class="oy-wavy" width="90" height="10" viewBox="0 0 90 10" fill="none" aria-hidden="true">
        <path d="M1 5 Q 7 1, 13 5 T 25 5 T 37 5 T 49 5 T 61 5 T 73 5 T 85 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h1 class="oy-h1 oy-hero-headline">Say the <span class="accent">word.</span></h1>
      <p class="oy-lede" style="margin-top:20px; max-width:440px">
        Twelve recordings from the campout. Invitation only, like the rest of it.
      </p>
      <form class="gate-form" id="gateForm" autocomplete="off" novalidate>
        <div class="reg-field" id="gateField">
          <label for="gateInput">Password</label>
          <input id="gateInput" type="password" name="tmko-listen-word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" autofocus>

            <input class="oy-seek" id="seek" type="range" min="0" max="100" step="1" value="0" aria-label="Seek">
          </div>

        </div>
        <div class="dk-transport">
          <button class="dk-btn dk-skip" id="btnBack" type="button" aria-label="Back 15 seconds">−15s</button>

  <noscript><p class="oy-lede" style="padding:24px 12px">This page needs JavaScript to unlock.</p></noscript>

  <!-- ============ FOOTER ============ -->

  </footer>
</main>

<audio id="audio" preload="none"></audio>

<script>
(() => {
  'use strict';

  const BASE_TITLE = document.title;
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');

  const ICON = {
    play:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>',
    prev:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>',
    next:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>',
    download: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
  const word = (n) => WORDS[n] || String(n);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const RATES = [1, 1.25, 1.5, 2, 0.75];
  // Bar heights for the seek bar's waveform. Decorative: not the recording's real levels.
  const WAVE = [30, 52, 44, 70, 38, 60, 82, 48, 66, 34, 58, 90, 72, 40, 64, 50, 78, 36, 56, 68,
                46, 84, 62, 42, 74, 54, 88, 38, 60, 70, 44, 80, 52, 66, 36, 58, 76, 48, 62, 40];

  // 1:23:45 / 18:01
  function clock(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  // ---- saved listening state (per browser; purely a convenience) ----
  const KEY = 'tmko:v1', HINT = 'tmko:in';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) {}
  saved.pos = saved.pos || {};
  saved.done = saved.done || {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (_) {} };
  const setHint = (on) => { try { on ? localStorage.setItem(HINT, '1') : localStorage.removeItem(HINT); } catch (_) {} };

  // ---- state ----
  const S = { eps: [], edition: '', i: -1, playAll: saved.auto !== false,
              rate: RATES.includes(saved.rate) ? saved.rate : 1, scrubbing: false,
              buffering: false, note: '', pendingSeek: 0, row: null };
  const audio = $('#audio');
  const seek = $('#seek'), scrub = $('#scrub');
  const curEp = () => S.eps[S.i];
  const dur = () => (Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (curEp() ? curEp().duration : 0));
  // preload="none": nothing downloads until play, so until then the start point lives in S.pendingSeek.
  const hasMeta = () => audio.readyState >= 1;
  const now = () => (hasMeta() ? audio.currentTime : S.pendingSeek);

  // ============ gate ============
  async function fetchEpisodes() {
    const res = await fetch('/api/episodes', { credentials: 'same-origin', cache: 'no-store' });
    if (res.status === 401) return null;
    if (!res.ok) throw new Error('episodes_' + res.status);
    return res.json();
  }

  function showGate() {
    document.documentElement.classList.remove('is-returning');
    $('#recordings').hidden = true;
    $('#gate').hidden = false;
    document.title = BASE_TITLE;
  }

  function gateError(msg) {
    $('#gateErr').textContent = msg;
    $('#gateField').classList.toggle('err', !!msg);
  }

  $('#gateForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = $('#gateInput'), btn = $('#gateBtn');
    if (!input.value.trim()) { gateError('Type the word first.'); input.focus(); return; }
    gateError('');
    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      const res = await fetch('/api/unlock', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.ok) {
        const data = await fetchEpisodes();
        if (!data) throw new Error('cookie_not_kept');
        input.value = '';
        enter(data);
        window.scrollTo({ top: 0 });
        return;
      }
      if (res.status === 429) gateError(`Slow down. Try again in ${body.retryAfter || 60}s.`);
      else gateError('Not that one. Try again.');
      input.select();
    } catch (_) {
      gateError("Can't reach the server. Try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  });

  async function lock() {
    savePos();
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    S.i = -1; S.row = null; S.pendingSeek = 0;
    if ('mediaSession' in navigator) { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; }
    setHint(false);
    try { await fetch('/api/unlock', { method: 'DELETE', credentials: 'same-origin' }); } catch (_) {}
    S.eps = [];
    $('#epList').innerHTML = '';
    showGate();
    gateError('');
    $('#gateInput').focus();
    window.scrollTo({ top: 0 });
  }

  // ============ render ============
  function enter(data) {
    document.documentElement.classList.remove('is-returning');
    S.eps = data.episodes.slice().sort((a, b) => a.number - b.number);
    S.edition = data.edition || 'Listening Edition';
    S.i = -1;
    renderHead();
    renderList();
    $('#gate').hidden = true;
    $('#recordings').hidden = false;
    setHint(true);
    applyRate();
    renderMode();
    if (S.eps.length) load(startIndex(), true);   // ready to go; preload="none" keeps it from downloading
  }

  // Where they left off: the last recording they had on, or the one after it if they finished it.
  function startIndex() {
    const i = S.eps.findIndex((e) => e.id === saved.last);
    if (i < 0) return 0;
    if (!saved.done[S.eps[i].id]) return i;
    return i + 1 < S.eps.length ? i + 1 : 0;
  }

  function renderHead() {
    const n = S.eps.length;
    const year = String((S.eps[0] && S.eps[0].date) || '').slice(0, 4);
    $('#podSub').textContent = `${cap(word(n))} recording${n === 1 ? '' : 's'} from Tramokyo${year ? ` ${year}` : ''}.`;
    $('#dkEdition').textContent = S.edition;
  }

  // Blob storage sends a public file as a download (not inline) when ?download=1 is added.
  function downloadUrl(src) {
    try { const u = new URL(src, location.href); u.searchParams.set('download', '1'); return u.href; }
    catch (_) { return src; }
  }

  function rowHTML(e) {
    const mb = e.bytes ? Math.max(1, Math.round(e.bytes / 1e6)) : 0;
    const size = mb ? `${mb} MB` : '';
    return `
      <li class="ep" data-id="${esc(e.id)}">
        <button class="ep-btn" type="button" data-play="${esc(e.id)}">
          <span class="ep-icon" aria-hidden="true"></span>
          <span class="ep-text">
            <span class="ep-code">${esc(e.code)}<span class="ep-dur-sm">${clock(e.duration)}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span>
            <span class="ep-title">${esc(e.title)}</span>
            <span class="ep-state"></span>
          </span>
          <span class="ep-dur">${clock(e.duration)}</span>
        </button>
        <a class="ep-dl" href="${esc(downloadUrl(e.src))}" download
           aria-label="${esc(`Download ${e.code}, ${e.title}${size ? `, ${size}` : ''}`)}"
           title="${esc(`Download${size ? ` (${size})` : ''}`)}">${ICON.download}</a>
        <span class="ep-bar" aria-hidden="true"><span></span></span>
      </li>`;
  }

  function renderList() {
    $('#epList').innerHTML = S.eps.map(rowHTML).join('');
    refreshRows();
  }

  function refreshRow(row) {
    const i = S.eps.findIndex((x) => x.id === row.dataset.id);
    const e = S.eps[i];
    if (!e) return;
    const cur = i === S.i;
    const playing = cur && !audio.paused;
    row.classList.toggle('is-current', cur);
    row.classList.toggle('is-playing', playing);
    if (cur) row.setAttribute('aria-current', 'true'); else row.removeAttribute('aria-current');

    let frac = 0, state = '';
    if (cur && (playing || hasMeta())) {
      if (audio.ended) { frac = 1; state = 'Played'; }
      else { frac = now() / dur(); if (!playing && now() > 10) state = `Paused at ${clock(now())}`; }
    }
    else if (cur && S.pendingSeek > 10) { frac = S.pendingSeek / e.duration; state = `Resume at ${clock(S.pendingSeek)}`; }
    else if (saved.done[e.id]) { frac = 1; state = 'Played'; }
    else if (!cur && saved.pos[e.id] > 10) { frac = saved.pos[e.id] / e.duration; state = `Resume at ${clock(saved.pos[e.id])}`; }

    $('.ep-icon', row).innerHTML = playing ? ICON.pause : ICON.play;
    $('.ep-state', row).textContent = state;
    $('.ep-bar span', row).style.width = `${Math.min(1, frac) * 100}%`;
    $('.ep-btn', row).setAttribute('aria-label',
      [`${playing ? 'Pause' : 'Play'} ${e.code}`, e.title, clock(e.duration), state].filter(Boolean).join(', '));
  }
  const refreshRows = () => $$('.ep').forEach(refreshRow);

  // ============ queue ============
  const nextIndex = () => (S.i >= 0 && S.i < S.eps.length - 1 ? S.i + 1 : -1);
  const prevIndex = () => (S.i > 0 ? S.i - 1 : -1);

  // ============ playback ============
  function savePos() {
    const e = curEp();
    if (!e || !hasMeta() || audio.ended) return;
    const t = audio.currentTime;
    if (t < 1 || t > e.duration - 15) return;
    saved.pos[e.id] = Math.floor(t);
    persist();
  }

  function load(i, resume) {
    savePos();
    const e = S.eps[i];
    S.i = i; S.note = ''; S.buffering = true;
    S.row = $(`.ep[data-id="${e.id}"]`);
    const p = saved.pos[e.id];
    S.pendingSeek = resume && !saved.done[e.id] && p > 10 && p < e.duration - 15 ? p : 0;
    audio.src = e.src;
    audio.defaultPlaybackRate = S.rate;   // a new src resets playbackRate to this
    audio.playbackRate = S.rate;
    saved.last = e.id;
    persist();

    seek.max = e.duration;
    seek.value = S.pendingSeek;
    $('#tCur').textContent = clock(S.pendingSeek);
    $('#tDur').textContent = clock(e.duration);
    fill();
    renderDock();
    mediaMeta(e);
    refreshRows();
  }

  function play() {
    const p = audio.play();
    if (p && p.catch) p.catch(onPlayError);
  }

  function playIndex(i, resume = true) {
    if (i !== S.i) load(i, resume);
    play();
  }

  function togglePlay() {
    if (S.i < 0) return;
    if (audio.error) load(S.i, true);   // last load failed: ask for the file again
    if (audio.paused) play(); else audio.pause();
  }

  function toggleEpisode(id) {
    const i = S.eps.findIndex((e) => e.id === id);
    if (i < 0) return;
    if (i === S.i) togglePlay(); else playIndex(i);
  }

  function next() { const n = nextIndex(); if (n >= 0) playIndex(n); }
  function prev() {
    const p = prevIndex();
    if (now() > 3 || p < 0) { seekTo(0); return; }
    playIndex(p);
  }

  // Before the file has loaded there's nothing to seek, so move the start point instead.
  function seekTo(t) {
    if (S.i < 0) return;
    t = Math.max(0, Math.min(dur(), t));
    if (hasMeta()) { audio.currentTime = t; return; }
    S.pendingSeek = t;
    seek.value = t;
    fill();
    $('#tCur').textContent = clock(t);
    renderMeta();
    if (S.row) refreshRow(S.row);
  }
  const skip = (sec) => seekTo(now() + sec);

  function toggleMode() {
    S.playAll = !S.playAll;
    saved.auto = S.playAll;
    persist();
    renderMode();
  }
  function renderMode() { $('#btnMode').setAttribute('aria-pressed', String(S.playAll)); }
  function applyRate() {
    audio.defaultPlaybackRate = S.rate;
    audio.playbackRate = S.rate;
    $('#btnRate').textContent = `${S.rate}×`;
    $('#btnRate').setAttribute('aria-label', `Playback speed ${S.rate} times, change`);
  }

  // ============ player panel ============
  function fill() {
    scrub.style.setProperty('--pct', `${seek.max > 0 ? (seek.value / seek.max) * 100 : 0}%`);
    seek.setAttribute('aria-valuetext', `${clock(seek.value)} of ${clock(seek.max)}`);
  }

  function renderMeta() {
    const e = curEp();
    if (!e) return;
    let state;
    if (S.note) state = S.note;
    else if (!audio.paused) state = S.buffering ? 'Loading' : 'Now playing';
    else if (audio.ended) state = 'Played';
    else if (hasMeta()) state = 'Paused';
    else state = S.pendingSeek > 10 ? `Resume at ${clock(S.pendingSeek)}` : 'Up next';
    $('#dkMeta').textContent = e.code;
    $('#dkState').textContent = state;
  }
  function renderDock() {
    const e = curEp();
    if (!e) return;
    $('#dkTitle').textContent = e.title;
    $('#btnNext').disabled = nextIndex() < 0;
    renderMeta();
  }
  function syncPlayState() {
    const playing = !audio.paused;
    $('#btnPlay').innerHTML = playing ? ICON.pause : ICON.play;
    $('#btnPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    renderMeta();
    refreshRows();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }
  function note(msg) {
    S.note = msg;
    renderMeta();
    clearTimeout(note.t);
    note.t = setTimeout(() => { S.note = ''; renderMeta(); }, 6000);
  }

  // ============ audio events ============
  let lastSave = 0, lastPos = 0;
  audio.addEventListener('loadedmetadata', () => {
    if (!curEp()) return;
    seek.max = dur();
    $('#tDur').textContent = clock(dur());
    if (S.pendingSeek) { audio.currentTime = S.pendingSeek; S.pendingSeek = 0; }
    fill();
  });
  audio.addEventListener('timeupdate', () => {
    const e = curEp();
    if (!e) return;
    const t = audio.currentTime;
    if (!S.scrubbing) { seek.value = t; fill(); $('#tCur').textContent = clock(t); }
    if (S.row) $('.ep-bar span', S.row).style.width = `${Math.min(1, t / dur()) * 100}%`;
    const stamp = Date.now();
    if (stamp - lastSave > 5000) { lastSave = stamp; savePos(); }
    if (stamp - lastPos > 1000) { lastPos = stamp; positionState(); }
  });
  audio.addEventListener('play', () => {
    const e = curEp();
    if (e) document.title = `${e.title} · TMKO`;
    syncPlayState();
  });
  audio.addEventListener('pause', () => { savePos(); syncPlayState(); });
  audio.addEventListener('playing', () => { S.buffering = false; syncPlayState(); });
  audio.addEventListener('waiting', () => { S.buffering = true; renderMeta(); });
  audio.addEventListener('canplay', () => { S.buffering = false; renderMeta(); });
  audio.addEventListener('seeked', () => { if (S.row) refreshRow(S.row); });
  audio.addEventListener('error', () => {
    if (!curEp()) return;
    S.buffering = false;
    note("Couldn't load, try again");
    syncPlayState();
  });
  audio.addEventListener('ended', () => {
    const e = curEp();
    if (!e) return;
    saved.done[e.id] = 1;
    delete saved.pos[e.id];
    persist();
    const n = S.playAll ? nextIndex() : -1;
    if (n >= 0) playIndex(n, false);
    else { renderDock(); syncPlayState(); }
  });
  function onPlayError(err) {
    if (err && err.name === 'AbortError') return;   // another load took over
    if (!(err && err.name === 'NotAllowedError')) note("Couldn't play that one");
    syncPlayState();
  }

  // ============ lock-screen controls ============
  function mediaMeta(e) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: e.title,
      artist: 'Tramokyo',
      album: `TMKO · ${S.edition}`,
      artwork: [{ src: '/assets/cover-512.png', sizes: '512x512', type: 'image/png' }],
    });
  }
  function positionState() {
    if (!('mediaSession' in navigator) || !curEp()) return;
    try { navigator.mediaSession.setPositionState({ duration: dur(), playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, dur()) }); } catch (_) {}
  }
  if ('mediaSession' in navigator) {
    const set = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (_) {} };
    set('play', play);
    set('pause', () => audio.pause());
    set('previoustrack', prev);
    set('nexttrack', next);
    set('seekbackward', (d) => skip(-((d && d.seekOffset) || 15)));
    set('seekforward', (d) => skip((d && d.seekOffset) || 30));
    set('seekto', (d) => seekTo(d.seekTime));
  }

  // ============ wiring ============
  $('#epList').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-play]');
    if (btn) toggleEpisode(btn.dataset.play);
  });
  $('#lockBtn').addEventListener('click', lock);
  $('#btnPlay').addEventListener('click', togglePlay);
  $('#btnPrev').addEventListener('click', prev);
  $('#btnNext').addEventListener('click', next);
  $('#btnBack').addEventListener('click', () => skip(-15));
  $('#btnFwd').addEventListener('click', () => skip(30));
  $('#btnMode').addEventListener('click', toggleMode);
  $('#btnRate').addEventListener('click', () => {
    S.rate = RATES[(RATES.indexOf(S.rate) + 1) % RATES.length];
    saved.rate = S.rate;
    persist();
    applyRate();
  });
  seek.addEventListener('input', () => {
    S.scrubbing = true;
    $('#tCur').textContent = clock(seek.value);
    fill();
  });
  seek.addEventListener('change', () => {
    S.scrubbing = false;
    seekTo(Number(seek.value));
  });

  // After a mouse click, drop focus so Space pauses instead of re-pressing the same button.
  document.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button');
    if (ev.detail && btn && btn.closest('.oy-dock, #epList')) btn.blur();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey || S.i < 0) return;
    const t = ev.target;
    if (t.closest('input:not([type="range"]), textarea, select, [contenteditable]')) return;   // typing
    const onSlider = t.matches('input[type="range"]');
    const onControl = !!t.closest('button, a');   // Space already activates a focused button
    if (ev.code === 'Space') { if (onControl) return; ev.preventDefault(); togglePlay(); }
    else if (ev.code === 'ArrowLeft' && !onSlider) { ev.preventDefault(); skip(-15); }
    else if (ev.code === 'ArrowRight' && !onSlider) { ev.preventDefault(); skip(30); }
    else if (ev.key === 'n' || ev.key === 'N') next();
    else if (ev.key === 'p' || ev.key === 'P') prev();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
  window.addEventListener('pagehide', savePos);

  $('#btnPrev').innerHTML = ICON.prev;
  $('#btnNext').innerHTML = ICON.next;
  $('#btnPlay').innerHTML = ICON.play;
  $$('.dk-wave').forEach((el) => { el.innerHTML = WAVE.map((h) => `<i style="height:${h}%"></i>`).join(''); });

  // ============ boot ============
  (async () => {
    try {
      const data = await fetchEpisodes();
      if (data) enter(data);
      else { setHint(false); showGate(); }
    } catch (_) {
      showGate();
    }
  })();
})();
</script>
</body>
</html>
