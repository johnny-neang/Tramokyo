<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tramokyo 2026 · Feedback</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tramokyo 2026 community feedback survey. Five to eight minutes. Anonymous unless you share your name.">
<meta name="theme-color" content="#E8412A">
<meta property="og:title" content="Tramokyo 2026 · Community Feedback">
<meta property="og:description" content="Tell us how it went. Five to eight minutes.">
<meta property="og:image" content="assets/hero.webp">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="modulepreload" href="survey-schema.js">
<!-- ?embed = shown inside the hub's survey pop-up (assets/survey-pop.js) -->
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embedded');</script>

<style>
  /* Brand tokens — mirror the main site's :root (BRAND.md §2). */
  :root {
    --oy-red:        #E8412A;
    --oy-red-deep:   #C8341F;
    --oy-red-soft:   #F4B8AC;
    --oy-cream:      #F2E8D5;
    --oy-cream-soft: #EADFC8;
    --oy-cream-warm: #F7F0E0;
    --oy-ink:        #1C1917;
    --oy-ink-soft:   #3B3430;
    --oy-mute:       #6B625B;
    --oy-hairline:   #C8BCA3;

    --oy-font-display: 'Archivo Black', 'Impact', sans-serif;
    --oy-font-body:    'DM Sans', system-ui, -apple-system, sans-serif;
    --oy-font-jp:      'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
    --oy-font-mono:    'JetBrains Mono', ui-monospace, monospace;

    --oy-ease: cubic-bezier(.2,.7,.2,1);
    --pad: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--oy-red);
    color: var(--oy-ink);
    font-family: var(--oy-font-body);
    -webkit-font-smoothing: antialiased;
    padding: var(--pad);
    padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)) max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
    display: flex; justify-content: center;
  }
  button { font: inherit; color: inherit; }

  /* ============ Frame: cream card, red inset border ============ */
  .frame {
    position: relative;
    width: 100%; max-width: 1180px;
    height: calc(100vh - 2 * var(--pad));
    height: calc(100dvh - 2 * var(--pad));
    min-height: 520px;
    background: var(--oy-cream);
    border-radius: 10px;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .frame::before {
    content: ""; position: absolute; inset: 10px;
    border: 1.5px solid var(--oy-red); border-radius: 6px;
    pointer-events: none; z-index: 5;
  }
  /* Inside the hub's pop-up: it brings its own bar and backdrop, so drop the
     red margin and the logo (which would load the hub inside the pop-up). */
  .embedded body { padding: 0; }
  .embedded .frame { max-width: none; height: 100vh; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; }
  .embedded .logo { visibility: hidden; }

  /* ============ Top bar ============ */
  .top {
    position: relative; z-index: 3;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px;
    padding: 30px 46px 0;
  }
  .logo img { display: block; height: clamp(24px, 2.6vw, 34px); width: auto; }
  .eyebrow {
    justify-self: center; display: flex; align-items: baseline; gap: 10px;
    font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--oy-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    transition: opacity .25s;
  }
  .eyebrow .l { color: var(--oy-red); font-weight: 700; }
  .eyebrow .jp { font-family: var(--oy-font-jp); font-weight: 700; color: var(--oy-red); letter-spacing: 3px; font-size: 12px; }
  .counter {
    font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--oy-mute); white-space: nowrap;
  }
  .counter b { color: var(--oy-ink); font-weight: 700; }

  .progress { margin: 16px 46px 0; height: 3px; background: var(--oy-cream-soft); border-radius: 2px; overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--oy-red); transition: width .45s var(--oy-ease); }

  /* ============ Stage: one card at a time ============ */
  .stage { position: relative; flex: 1; min-height: 0; }
  .card {
    position: absolute; inset: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 28px 46px 32px;
    display: flex; flex-direction: column;
  }
  .card-inner { width: 100%; max-width: 680px; margin: auto; padding: 8px 0; }
  .card.is-intro .card-inner { max-width: 1040px; }
  .card.enter-next { animation: inNext .42s var(--oy-ease) both; }
  .card.enter-prev { animation: inPrev .42s var(--oy-ease) both; }
  .card.leave-next { animation: outNext .26s ease-in both; pointer-events: none; }
  .card.leave-prev { animation: outPrev .26s ease-in both; pointer-events: none; }
  @keyframes inNext  { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
  @keyframes inPrev  { from { opacity: 0; transform: translateY(-36px); } to { opacity: 1; transform: none; } }
  @keyframes outNext { to { opacity: 0; transform: translateY(-28px); } }
  @keyframes outPrev { to { opacity: 0; transform: translateY(28px); } }

  /* Chapter header at the start of each section */
  .chapter { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  .chapter .letter { font-family: var(--oy-font-display); font-size: 44px; line-height: .9; color: var(--oy-red); }
  .chapter .title { font-family: var(--oy-font-display); font-size: clamp(20px, 2.6vw, 28px); text-transform: uppercase; letter-spacing: -.3px; line-height: 1.05; }
  .chapter .jp { font-family: var(--oy-font-jp); font-weight: 900; color: var(--oy-red); letter-spacing: 4px; font-size: 15px; margin-left: auto; }
  .chapter .perf {
    flex-basis: 100%; height: 8px; margin-top: 10px;
    background-image: radial-gradient(circle, var(--oy-red) 2px, transparent 2.5px);
    background-size: 10px 8px; background-repeat: repeat-x; background-position: left center;
    animation: perf .7s var(--oy-ease) .1s both;
  }
  @keyframes perf { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .qnum { font-family: var(--oy-font-mono); font-weight: 700; font-size: 12px; letter-spacing: 2px; color: var(--oy-red); margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
  .qnum .opt-tag { color: var(--oy-mute); font-weight: 500; border: 1px solid var(--oy-hairline); padding: 2px 6px; border-radius: 2px; font-size: 9px; }
  .qtext { font-family: var(--oy-font-body); font-weight: 600; font-size: clamp(22px, 3vw, 32px); line-height: 1.22; letter-spacing: -.3px; color: var(--oy-ink); }
  .qhint { font-style: italic; color: var(--oy-mute); font-size: 15px; margin-top: 8px; }
  .rowlabel {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 18px;
    font-family: var(--oy-font-display); font-size: clamp(20px, 2.4vw, 26px); text-transform: uppercase; letter-spacing: -.2px;
  }
  .rowlabel .of { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 2px; color: var(--oy-mute); border: 1.5px solid var(--oy-ink); padding: 3px 8px; }
  .rowdots { display: flex; gap: 6px; margin-top: 12px; }
  .rowdots span { width: 22px; height: 4px; background: var(--oy-cream-soft); border-radius: 1px; }
  .rowdots span.done { background: var(--oy-ink); }
  .rowdots span.now { background: var(--oy-red); }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 9px; margin-top: 26px; max-width: 560px; }
  .opt {
    position: relative;
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 13px 16px; text-align: left;
    background: var(--oy-cream-warm); border: 1.5px solid var(--oy-ink); border-radius: 2px;
    font-size: 16px; font-weight: 600; line-height: 1.3; cursor: pointer;
    transition: background .15s, color .15s, transform .12s var(--oy-ease), box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
    animation: optIn .4s var(--oy-ease) both;
  }
  @keyframes optIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .opt:hover { background: var(--oy-cream-soft); }
  .opt:focus-visible { outline: 2px solid var(--oy-red); outline-offset: 3px; }
  .opt kbd {
    flex: 0 0 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--oy-font-mono); font-size: 11px; font-weight: 700;
    border: 1.5px solid var(--oy-ink); border-radius: 2px; background: var(--oy-cream);
  }
  .opt .lbl { flex: 1; }
  .opt .tick { flex: 0 0 auto; font-weight: 700; opacity: 0; transition: opacity .15s; }
  .opt.multi .tick { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 2px; opacity: .55; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; }
  .opt.multi[aria-checked="true"] .tick { color: inherit; }
  .opt[aria-checked="true"] {
    background: var(--oy-red); color: var(--oy-cream); border-color: var(--oy-red);
    box-shadow: 3px 3px 0 var(--oy-ink); transform: translate(-1px, -1px);
  }
  .opt[aria-checked="true"] kbd { background: var(--oy-cream); color: var(--oy-red); border-color: var(--oy-cream); }
  .opt[aria-checked="true"] .tick { opacity: 1; }
  .opt.pop { animation: pop .32s cubic-bezier(.2,1.6,.5,1); }
  @keyframes pop { 0% { transform: translate(-1px,-1px) scale(1); } 40% { transform: translate(-1px,-1px) scale(1.02); } 100% { transform: translate(-1px,-1px) scale(1); } }
  .opt[aria-disabled="true"] { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
  .opt[aria-disabled="true"]:hover { background: var(--oy-cream-warm); }

  .other { margin-top: 4px; animation: optIn .3s var(--oy-ease) both; }

  /* Text answers */
  .field {
    display: block; width: 100%; max-width: 620px; margin-top: 26px;
    padding: 10px 0 10px; border: none; border-bottom: 2px solid var(--oy-ink); border-radius: 0;
    background: transparent; outline: none;
    font-family: var(--oy-font-body); font-size: clamp(18px, 2.2vw, 22px); line-height: 1.45; color: var(--oy-ink);
  }
  .other .field { margin-top: 6px; font-size: 17px; }
  textarea.field { resize: none; min-height: 3.2em; max-height: 40vh; overflow-y: auto; }
  .field:focus { border-color: var(--oy-red); }
  .field::placeholder { color: var(--oy-mute); opacity: .55; font-style: italic; }
  .count-left { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--oy-mute); margin-top: 6px; text-align: right; max-width: 620px; opacity: 0; transition: opacity .2s; }
  .count-left.show { opacity: 1; }

  .err {
    min-height: 18px; margin-top: 16px;
    font-family: var(--oy-font-mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--oy-red);
  }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* ============ Bottom nav ============ */
  .nav {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 46px 30px;
    border-top: 1.5px dashed var(--oy-hairline);
    margin: 0 30px; padding-left: 16px; padding-right: 16px;
  }
  .nav .spacer { flex: 1; }
  .keyhint { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--oy-mute); }
  .keyhint kbd { font-family: inherit; border: 1px solid var(--oy-hairline); padding: 1px 5px; border-radius: 2px; color: var(--oy-ink-soft); }
  @media (hover: none) { .keyhint { display: none; } .opt kbd { display: none; } }

  .btn {
    position: relative; isolation: isolate;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 28px; border: none; border-radius: 2px;
    background: var(--oy-red); color: var(--oy-cream);
    font-family: var(--oy-font-body); font-weight: 600; font-size: 15px; white-space: nowrap;
    cursor: pointer; text-decoration: none;
    transition: transform 120ms var(--oy-ease), background 200ms var(--oy-ease), opacity .2s;
  }
  .btn::before {
    content: ""; position: absolute; inset: -6px -6px 6px 6px;
    border: 1.5px solid var(--oy-ink); border-radius: 2px; z-index: -1;
  }
  .btn:hover { background: var(--oy-red-deep); transform: translate(-1px,-1px); }
  .btn:active { transform: translate(1px,1px); }
  .btn:focus-visible { outline: 2px solid var(--oy-ink); outline-offset: 8px; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.big { padding: 17px 38px; font-size: 16px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; background: transparent; border: 1.5px solid var(--oy-ink); border-radius: 2px;
    font-family: var(--oy-font-body); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
    text-decoration: none; color: var(--oy-ink);
    transition: color .2s, border-color .2s;
  }
  .btn-ghost:hover { color: var(--oy-red); border-color: var(--oy-red); }
  .btn-ghost:focus-visible { outline: 2px solid var(--oy-red); outline-offset: 3px; }
  .btn-link {
    background: none; border: none; cursor: pointer; padding: 6px 2px;
    font-family: var(--oy-font-mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--oy-mute);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .btn-link:hover { color: var(--oy-red); }

  /* ============ Intro ============ */
  .intro { display: grid; grid-template-columns: 1.05fr 1fr; gap: 44px; align-items: center; max-width: 1040px; margin: auto; width: 100%; }
  .stamp {
    display: inline-block; border: 1.5px solid var(--oy-ink); padding: 4px 12px;
    font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  }
  .kana { font-family: var(--oy-font-jp); font-weight: 900; color: var(--oy-red); letter-spacing: 4px; font-size: 20px; margin: 22px 0 6px; }
  .wavy { color: var(--oy-red); display: block; margin-bottom: 14px; }
  .intro h1 { font-family: var(--oy-font-display); font-size: clamp(38px, 5.4vw, 66px); line-height: .98; letter-spacing: -1px; text-transform: uppercase; }
  .intro h1 .red { color: var(--oy-red); display: block; }
  .intro .lede { font-size: 17px; line-height: 1.6; color: var(--oy-ink-soft); max-width: 470px; margin-top: 18px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .chip {
    display: inline-block; padding: 6px 11px; background: var(--oy-cream); border: 1.5px solid var(--oy-ink);
    font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  }
  .intro .cta { display: flex; align-items: center; gap: 22px; margin-top: 34px; flex-wrap: wrap; }
  .art { position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
  .art img { width: 100%; height: 100%; object-fit: contain; animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
  .art .sunstamp {
    position: absolute; right: 2%; bottom: 6%;
    width: 112px; height: 112px; transform: rotate(-10deg);
  }
  .meta-foot {
    font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--oy-mute);
    margin-top: 28px;
  }
  .intro-copy > * { animation: optIn .6s var(--oy-ease) both; }
  .intro-copy > *:nth-child(2) { animation-delay: .05s; }
  .intro-copy > *:nth-child(3) { animation-delay: .1s; }
  .intro-copy > *:nth-child(4) { animation-delay: .15s; }
  .intro-copy > *:nth-child(5) { animation-delay: .2s; }
  .intro-copy > *:nth-child(6) { animation-delay: .25s; }
  .intro-copy > *:nth-child(7) { animation-delay: .3s; }

  /* ============ Review + Done ============ */
  .center { text-align: center; }
  .big-h { font-family: var(--oy-font-display); font-size: clamp(34px, 5vw, 56px); line-height: .98; text-transform: uppercase; letter-spacing: -1px; }
  .big-h .red { color: var(--oy-red); display: block; }
  .sub { font-style: italic; font-size: 18px; line-height: 1.5; color: var(--oy-ink-soft); max-width: 480px; margin: 14px auto 0; }
  .sections { margin: 30px auto 0; max-width: 520px; border-top: 1.5px solid var(--oy-ink); text-align: left; }
  .sec-row {
    width: 100%; display: grid; grid-template-columns: 34px 1fr auto auto; gap: 12px; align-items: baseline;
    padding: 12px 4px; background: none; border: none; border-bottom: 1px dashed var(--oy-hairline);
    cursor: pointer; text-align: left;
  }
  .sec-row:hover .t { color: var(--oy-red); }
  .sec-row:focus-visible { outline: 2px solid var(--oy-red); outline-offset: 2px; }
  .sec-row .l { font-family: var(--oy-font-display); color: var(--oy-red); font-size: 18px; }
  .sec-row .t { font-weight: 600; font-size: 15px; }
  .sec-row .n { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--oy-mute); text-transform: uppercase; }
  .sec-row .e { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--oy-mute); text-transform: uppercase; }
  .send-row { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .notice {
    margin: 22px auto 0; max-width: 520px; padding: 12px 16px; text-align: left;
    border: 1.5px dashed var(--oy-red); color: var(--oy-ink-soft); font-size: 13px; line-height: 1.5; background: var(--oy-cream-warm);
  }
  .notice b { font-family: var(--oy-font-mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--oy-red); display: block; margin-bottom: 4px; }

  .stamp-svg { width: 190px; height: 190px; margin: 0 auto 26px; display: block; animation: stampIn .55s cubic-bezier(.2,1.6,.5,1) .15s both; }
  @keyframes stampIn { 0% { transform: scale(1.9) rotate(-22deg); opacity: 0; } 100% { transform: scale(1) rotate(-10deg); opacity: 1; } }
  .ticket {
    display: inline-block; margin-top: 26px; padding: 13px 22px;
    border: 1.5px solid var(--oy-ink); background: var(--oy-cream-warm);
    font-family: var(--oy-font-mono); font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  }
  .ticket .n { font-family: var(--oy-font-display); font-size: 22px; color: var(--oy-red); letter-spacing: 1px; margin-left: 8px; }

  /* Shared photo album, on the thank-you screen */
  .album {
    position: relative; margin: 40px auto 0; max-width: 480px; padding: 26px 24px 30px;
    border: 1.5px solid var(--oy-ink); background: var(--oy-cream-warm); text-align: center;
    animation: optIn .6s var(--oy-ease) .5s both;
  }
  .album .kana-tag {
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    background: var(--oy-cream); padding: 0 12px;
    font-family: var(--oy-font-jp); font-weight: 900; color: var(--oy-red); letter-spacing: 4px; font-size: 14px;
  }
  .album h3 { font-family: var(--oy-font-display); font-size: clamp(22px, 3vw, 28px); text-transform: uppercase; letter-spacing: -.3px; line-height: 1.05; }
  .album p { font-size: 16px; line-height: 1.55; color: var(--oy-ink-soft); margin: 10px auto 24px; max-width: 380px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ============ Responsive ============ */
  @media (max-width: 860px) {
    .intro { grid-template-columns: 1fr; gap: 8px; }
    .art { order: -1; aspect-ratio: auto; height: min(24vh, 220px); margin-top: -6px; }
    .art .sunstamp { width: 84px; height: 84px; right: 0; bottom: 0; }
    .intro .lede { font-size: 16px; }
  }
  @media (max-width: 640px) {
    :root { --pad: 10px; }
    .frame::before { inset: 6px; }
    .top { padding: 20px 22px 0; gap: 12px; grid-template-columns: auto 1fr; }
    .eyebrow { display: none; }
    .counter { justify-self: end; }
    .progress { margin: 12px 22px 0; }
    .card { padding: 22px 22px 24px; }
    .card-inner { margin: 0 auto auto; }
    .card.is-intro .card-inner, .card.is-done .card-inner { margin: auto; }
    .chapter { margin-bottom: 20px; gap: 10px; }
    .chapter .letter { font-size: 34px; }
    .opts { margin-top: 20px; gap: 8px; }
    .opt { padding: 13px 14px; font-size: 15px; }
    .nav { margin: 0 14px; padding: 12px 8px 20px; gap: 10px; }
    .nav .btn { padding: 13px 22px; }
    .intro .cta { margin-top: 26px; }
    .intro .cta .btn { flex: 1; }
    .kana { margin-top: 14px; font-size: 17px; }
  }
  @media (max-height: 640px) and (min-width: 641px) {
    .top { padding-top: 22px; }
    .card { padding-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="frame">
  <header class="top">
    <a class="logo" id="logoLink" href="#" aria-label="Tramokyo"><img src="assets/logo.png" alt="Tramokyo" width="960" height="143"></a>
    <div class="eyebrow" id="eyebrow" aria-hidden="true"></div>
    <div class="counter" id="counter" aria-live="polite"></div>
  </header>
  <div class="progress" id="progress" hidden><div class="fill" id="progressFill"></div></div>

  <main class="stage" id="stage" aria-live="polite">
    <noscript><div class="card"><div class="card-inner center"><h1 class="big-h">Turn on JavaScript</h1><p class="sub">This survey needs it to run.</p></div></div></noscript>
  </main>

  <nav class="nav" id="nav" hidden aria-label="Survey navigation">
    <button class="btn-ghost" id="backBtn" type="button" aria-label="Previous question">↑ Back</button>
    <div class="spacer"></div>
    <span class="keyhint" id="keyhint"></span>
    <button class="btn" id="nextBtn" type="button">OK →</button>
  </nav>
</div>

<script type="module">
  import { SURVEY_SECTIONS, SURVEY_QUESTIONS, isVisible, validateSurvey, surveyColumns, SURVEY_VERSION, MAX_TEXT } from './survey-schema.js';
  import { SUBMIT_URL, MAIN_SITE_URL, PHOTO_ALBUM_URL } from './config.js';

  const EMBEDDED = document.documentElement.classList.contains('embedded');
  const DRAFT_KEY = 'tramokyo-survey:draft:v1';
  const DONE_KEY = 'tramokyo-survey:done:v1';
  const LETTERS = 'ABCDEFGHIJ';
  const TOTAL_Q = SURVEY_QUESTIONS.length;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} }
  };

  const els = {
    stage: $('#stage'), nav: $('#nav'), back: $('#backBtn'), next: $('#nextBtn'),
    keyhint: $('#keyhint'), counter: $('#counter'), eyebrow: $('#eyebrow'),
    progress: $('#progress'), fill: $('#progressFill')
  };
  $('#logoLink').href = MAIN_SITE_URL || '#';

  const QBY = Object.fromEntries(SURVEY_QUESTIONS.map(q => [q.id, q]));
  const SECTION_OF = {};
  SURVEY_SECTIONS.forEach(s => s.questions.forEach((q, i) => { SECTION_OF[q.id] = { s, first: i === 0 }; }));

  // ---------- State ----------
  let answers = {};
  let cur = 'intro';
  let responseId = null;
  let advanceTimer = null;
  let sending = false;

  function save() { store.set(DRAFT_KEY, { answers, cur, responseId }); }

  // Steps are recomputed from answers every time, so conditional questions
  // appear and disappear on their own. A grid question becomes one step per row.
  function steps() {
    const list = ['intro'];
    for (const q of SURVEY_QUESTIONS) {
      if (!isVisible(q, answers)) continue;
      if (q.type === 'grid') q.rows.forEach(r => list.push(`${q.id}.${r.id}`));
      else list.push(q.id);
    }
    list.push('review');
    return list;
  }
  function parseKey(key) {
    const [qid, rid] = key.split('.');
    const q = QBY[qid];
    return { q, row: q && rid ? q.rows.find(r => r.id === rid) : null };
  }

  function isAnswered(q, row) {
    const v = answers[q.id];
    if (q.type === 'grid') return !!(v && v[row.id]);
    if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
    return typeof v === 'string' && v.trim() !== '';
  }

  // ---------- Rendering ----------
  function optionHtml(value, i, checked, { multi = false, disabled = false } = {}) {
    return `<button type="button" class="opt${multi ? ' multi' : ''}" role="${multi ? 'checkbox' : 'radio'}"
      aria-checked="${checked}" ${disabled ? 'aria-disabled="true"' : ''} data-value="${esc(value)}"
      style="animation-delay:${60 + i * 35}ms">
      <kbd aria-hidden="true">${LETTERS[i]}</kbd><span class="lbl">${esc(value)}</span>
      <span class="tick" aria-hidden="true">✓</span></button>`;
  }

  function questionHtml(key) {
    const { q, row } = parseKey(key);
    const { s, first } = SECTION_OF[q.id];
    const isFirstRow = !row || row === q.rows[0];
    let h = '';
    if (first && isFirstRow) {
      h += `<div class="chapter"><span class="letter">${s.letter}</span><span class="title">${esc(s.title)}</span>
        <span class="jp" lang="ja">${s.jp}</span><span class="perf"></span></div>`;
    }
    h += `<div class="qnum">Q${pad(q.n)} <span style="color:var(--oy-mute);font-weight:500">/ ${TOTAL_Q}</span>
      ${q.optional ? '<span class="opt-tag">OPTIONAL</span>' : ''}</div>`;
    h += `<h2 class="qtext" id="qtext">${esc(q.label)}</h2>`;
    if (q.hint) h += `<p class="qhint">${esc(q.hint)}</p>`;

    if (q.type === 'text' || q.type === 'paragraph') {
      const v = answers[q.id] || '';
      const ph = q.type === 'text' ? 'Type your answer…' : 'Type as much or as little as you like…';
      h += q.type === 'text'
        ? `<input class="field" id="field" type="text" maxlength="200" autocomplete="${q.id === 'name' ? 'name' : 'off'}" aria-labelledby="qtext" placeholder="${ph}" value="${esc(v)}">`
        : `<textarea class="field" id="field" rows="2" maxlength="${MAX_TEXT}" aria-labelledby="qtext" placeholder="${ph}">${esc(v)}</textarea>
           <div class="count-left" id="countLeft"></div>`;
    } else if (q.type === 'grid') {
      const idx = q.rows.indexOf(row);
      h += `<div class="rowlabel">${esc(row.label)} <span class="of">${idx + 1} / ${q.rows.length}</span></div>`;
      h += `<div class="rowdots" aria-hidden="true">${q.rows.map((r, i) => `<span class="${i === idx ? 'now' : (answers[q.id] || {})[r.id] ? 'done' : ''}"></span>`).join('')}</div>`;
      const v = (answers[q.id] || {})[row.id];
      h += `<div class="opts" role="radiogroup" aria-label="${esc(row.label)}">${q.columns.map((c, i) => optionHtml(c, i, v === c)).join('')}</div>`;
    } else {
      const multi = q.type === 'multi';
      const v = answers[q.id];
      const chosen = multi ? (v || []) : [v];
      let minIdx = -1;
      if (q.notBefore && answers[q.notBefore]) minIdx = q.options.indexOf(answers[q.notBefore]);
      h += `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-labelledby="qtext">`;
      h += q.options.map((o, i) => optionHtml(o, i, chosen.includes(o), { multi, disabled: i < minIdx })).join('');
      if (q.other) {
        const show = chosen.includes(q.other);
        h += `<div class="other" id="otherWrap" ${show ? '' : 'hidden'}>
          <input class="field" id="otherField" type="text" maxlength="300" placeholder="${multi ? 'Tell us what else…' : 'In your words…'}"
            aria-label="${esc(q.other)}, please specify" value="${esc(answers[q.id + 'Other'] || '')}"></div>`;
      }
      h += `</div>`;
    }
    h += `<div class="err" id="err" role="alert"></div>`;
    return h;
  }

  function introHtml() {
    const draft = Object.keys(answers).length > 0;
    return `<div class="intro">
      <div class="intro-copy">
        <div><span class="stamp">Form F-26 · Field Report</span></div>
        <div class="kana" lang="ja">感想 · 十月 15–19</div>
        <svg class="wavy" width="90" height="10" viewBox="0 0 90 10" fill="none" aria-hidden="true"><path d="M1 5 Q 7 1, 13 5 T 25 5 T 37 5 T 49 5 T 61 5 T 73 5 T 85 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <h1>Community<br>Feedback<span class="red">Tramokyo 2026</span></h1>
        <p class="lede">Thank you for being part of Tramokyo 2026! Your feedback will help us improve our next gathering. This survey is anonymous unless you share your name.</p>
        <div class="facts"><span class="chip">${TOTAL_Q} questions</span><span class="chip">5–8 minutes</span><span class="chip">Anonymous by default</span></div>
        <div class="cta">
          <button class="btn big" id="startBtn" type="button">${draft ? 'Pick up where you left off →' : 'Begin →'}</button>
          ${draft
            ? '<button class="btn-link" id="restartBtn" type="button">Start over</button>'
            : '<span class="keyhint">or press <kbd>Enter ↵</kbd></span>'}
        </div>
        <div class="meta-foot">EST · 2026 · 山中湖</div>
      </div>
      <div class="art" aria-hidden="true">
        <img src="assets/hero.webp" alt="" width="900" height="675" fetchpriority="high">
        <svg class="sunstamp" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="var(--oy-cream)" stroke="#E8412A" stroke-width="3"/>
          <circle cx="60" cy="60" r="47" fill="none" stroke="#E8412A" stroke-width="1" stroke-dasharray="2 3"/>
          <text x="60" y="54" text-anchor="middle" fill="#E8412A" font-family="Archivo Black, sans-serif" font-size="13" letter-spacing="1">TELL US</text>
          <text x="60" y="73" text-anchor="middle" fill="#E8412A" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8" letter-spacing="2">HOW IT WENT</text>
        </svg>
      </div>
    </div>`;
  }

  function reviewHtml() {
    const vis = SURVEY_QUESTIONS.filter(q => isVisible(q, answers));
    const answered = vis.filter(q => q.type === 'grid' ? q.rows.every(r => isAnswered(q, r)) : isAnswered(q)).length;
    const rows = SURVEY_SECTIONS.map(s => {
      const qs = s.questions.filter(q => isVisible(q, answers));
      const a = qs.filter(q => q.type === 'grid' ? q.rows.every(r => isAnswered(q, r)) : isAnswered(q)).length;
      const firstKey = qs[0].type === 'grid' ? `${qs[0].id}.${qs[0].rows[0].id}` : qs[0].id;
      return `<button type="button" class="sec-row" data-jump="${firstKey}">
        <span class="l">${s.letter}</span><span class="t">${esc(s.title)}</span>
        <span class="n">${a} / ${qs.length}</span><span class="e">Edit ↗</span></button>`;
    }).join('');
    const preview = !SUBMIT_URL;
    return `<div class="center">
      <div class="chapter" style="justify-content:center"><span class="jp" lang="ja" style="margin:0">提出</span></div>
      <h2 class="big-h">That's the<span class="red">whole form.</span></h2>
      <p class="sub">${answered} of ${vis.length} answered. Look it over, or send it as is.</p>
      <div class="sections">${rows}</div>
      ${preview ? `<div class="notice"><b>Preview mode</b>Responses aren't connected yet, so this one won't be saved. Add the Google Sheet link in <code>config.js</code> to go live.</div>` : ''}
      <div class="send-row">
        <button class="btn big" id="sendBtn" type="button">Send My Feedback →</button>
        <div class="err" id="err" role="alert"></div>
      </div>
    </div>`;
  }

  function doneHtml(id) {
    return `<div class="center">
      <svg class="stamp-svg" viewBox="0 0 180 180" aria-hidden="true">
        <g transform="rotate(-10 90 90)">
          <circle cx="90" cy="90" r="78" fill="none" stroke="#E8412A" stroke-width="4"/>
          <circle cx="90" cy="90" r="70" fill="none" stroke="#E8412A" stroke-width="1.5" stroke-dasharray="2 3"/>
          <text x="90" y="72" text-anchor="middle" fill="#E8412A" font-family="Archivo Black, sans-serif" font-size="18" letter-spacing="2">RECEIVED</text>
          <line x1="40" y1="88" x2="140" y2="88" stroke="#E8412A" stroke-width="1.5"/>
          <text x="90" y="108" text-anchor="middle" fill="#E8412A" font-family="JetBrains Mono, monospace" font-weight="700" font-size="10" letter-spacing="2">TRAM · 2026</text>
          <text x="90" y="128" text-anchor="middle" fill="#E8412A" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="2">LANDERS CA</text>
        </g>
      </svg>
      <h2 class="big-h">Thank you<span class="red">for sharing.</span></h2>
      <p class="sub">Thank you for sharing your thoughts! We hope to see you at Hotel Tramsylvania 2027.</p>
      <div class="ticket">Report filed<span class="n">${esc(id ? 'F-' + id.replace(/-/g, '').slice(-6) : 'F-000000')}</span></div>
      ${PHOTO_ALBUM_URL ? `<div class="album">
        <span class="kana-tag" lang="ja">写真</span>
        <h3>Share your photos</h3>
        <p>What a weekend with all of you. We started a shared album so everyone can have the memories. Add your photos and videos, and grab everyone else's.</p>
        <a class="btn" href="${esc(PHOTO_ALBUM_URL)}" target="_blank" rel="noopener">Open the shared album →</a>
      </div>` : ''}
    </div>`;
  }

  // ---------- Card transitions ----------
  function mount(html, cls, dir) {
    const old = $$('.card', els.stage).filter(c => !c.classList.contains('leave-next') && !c.classList.contains('leave-prev'));
    old.forEach(c => {
      c.classList.add(dir === 'prev' ? 'leave-prev' : 'leave-next');
      setTimeout(() => c.remove(), 280);
    });
    const card = document.createElement('section');
    card.className = `card ${cls || ''} ${old.length ? (dir === 'prev' ? 'enter-prev' : 'enter-next') : 'enter-next'}`;
    card.innerHTML = `<div class="card-inner">${html}</div>`;
    els.stage.appendChild(card);
    return card;
  }

  function chrome(key) {
    const list = steps();
    const qSteps = list.filter(k => k !== 'intro' && k !== 'review');
    const inQ = key !== 'intro' && key !== 'review' && key !== 'done';
    els.nav.hidden = !(inQ || key === 'review');
    els.progress.hidden = key === 'intro' || key === 'done';
    els.next.hidden = key === 'review';
    els.keyhint.hidden = key === 'review';
    els.back.hidden = EMBEDDED && list.indexOf(key) === 1; // no welcome screen to go back to

    if (inQ) {
      const { q } = parseKey(key);
      const { s } = SECTION_OF[q.id];
      els.eyebrow.innerHTML = `<span class="l">${s.letter}</span><span>${esc(s.title)}</span><span class="jp" lang="ja">${s.jp}</span>`;
      els.counter.innerHTML = `<b>Q${pad(q.n)}</b> / ${TOTAL_Q}`;
      const i = qSteps.indexOf(key);
      els.fill.style.width = `${Math.round((i / qSteps.length) * 100)}%`;
    } else if (key === 'review') {
      els.eyebrow.innerHTML = `<span class="l">✓</span><span>Ready to file</span>`;
      els.counter.innerHTML = `<b>Review</b>`;
      els.fill.style.width = '100%';
    } else {
      els.eyebrow.innerHTML = '';
      els.counter.innerHTML = key === 'done' ? '<b>Filed</b>' : '';
    }
    updateNextBtn();
  }

  function updateNextBtn() {
    if (cur === 'intro' || cur === 'review' || cur === 'done') return;
    const { q, row } = parseKey(cur);
    const list = steps();
    const isLast = list[list.indexOf(cur) + 1] === 'review';
    const has = isAnswered(q, row);
    els.next.textContent = !has && q.optional ? 'Skip →' : isLast ? 'Review →' : 'OK →';
    const textual = q.type === 'text' || q.type === 'paragraph';
    els.keyhint.innerHTML = q.type === 'paragraph'
      ? 'press <kbd>⌘/Ctrl + Enter ↵</kbd>'
      : textual ? 'press <kbd>Enter ↵</kbd>'
      : `press <kbd>A</kbd>–<kbd>${LETTERS[(q.options || q.columns).length - 1]}</kbd> or <kbd>Enter ↵</kbd>`;
  }

  function show(key, dir = 'next') {
    clearTimeout(advanceTimer);
    cur = key;
    if (key !== 'done' && key !== 'intro') save(); // keep the resume point while on the welcome screen
    let card;
    if (key === 'intro') card = mount(introHtml(), 'is-intro', dir);
    else if (key === 'review') card = mount(reviewHtml(), 'is-review', dir);
    else if (key === 'done') card = mount(doneHtml(store.get(DONE_KEY)?.id), 'is-done', dir);
    else card = mount(questionHtml(key), 'is-q', dir);
    chrome(key);
    wire(card, key);
  }

  // ---------- Interaction ----------
  function setErr(card, msg) {
    const e = $('#err', card);
    if (!e) return;
    e.textContent = msg ? '↑ ' + msg : '';
    if (msg) {
      const target = $('.opts', card) || $('.field', card) || e;
      target.classList.remove('shake'); void target.offsetWidth; target.classList.add('shake');
    }
  }

  function autosize(t) {
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight + 2, window.innerHeight * 0.4) + 'px';
  }

  function wire(card, key) {
    if (key === 'intro') {
      $('#startBtn', card).addEventListener('click', start);
      $('#restartBtn', card)?.addEventListener('click', () => {
        answers = {}; responseId = null; store.del(DRAFT_KEY); show('intro');
      });
      return;
    }
    if (key === 'review') {
      $$('[data-jump]', card).forEach(b => b.addEventListener('click', () => show(b.dataset.jump, 'prev')));
      $('#sendBtn', card).addEventListener('click', () => submit(card));
      setTimeout(() => $('#sendBtn', card)?.focus({ preventScroll: true }), 350);
      return;
    }
    if (key === 'done') return;

    const { q, row } = parseKey(key);
    const field = $('#field', card);
    if (field) {
      if (field.tagName === 'TEXTAREA') autosize(field);
      const counter = $('#countLeft', card);
      field.addEventListener('input', () => {
        answers[q.id] = field.value;
        if (!field.value.trim()) delete answers[q.id];
        if (field.tagName === 'TEXTAREA') autosize(field);
        if (counter) {
          const left = MAX_TEXT - field.value.length;
          counter.textContent = `${left} characters left`;
          counter.classList.toggle('show', left < 400);
        }
        setErr(card, '');
        updateNextBtn();
        save();
      });
      // Don't pop the keyboard on phones until they tap; do focus on desktop.
      if (matchMedia('(hover: hover)').matches) setTimeout(() => field.focus({ preventScroll: true }), 380);
    }

    const other = $('#otherField', card);
    if (other) {
      other.addEventListener('input', () => {
        answers[q.id + 'Other'] = other.value;
        if (!other.value.trim()) delete answers[q.id + 'Other'];
        save();
      });
    }

    $$('.opt', card).forEach(btn => btn.addEventListener('click', () => choose(card, q, row, btn)));
    if (!field && matchMedia('(hover: hover)').matches) {
      setTimeout(() => ($('.opt[aria-checked="true"]', card) || $('.opt:not([aria-disabled])', card))?.focus({ preventScroll: true }), 380);
    }
  }

  function choose(card, q, row, btn) {
    if (btn.getAttribute('aria-disabled') === 'true') return;
    const value = btn.dataset.value;
    clearTimeout(advanceTimer);
    setErr(card, '');

    if (q.type === 'grid') {
      answers[q.id] = { ...(answers[q.id] || {}), [row.id]: value };
    } else if (q.type === 'multi') {
      let v = new Set(answers[q.id] || []);
      if (v.has(value)) v.delete(value);
      else {
        // Exclusive picks ("No challenges", "No preference"…) clear the rest, and vice versa.
        if (q.exclusive?.includes(value)) v = new Set();
        else q.exclusive?.forEach(x => v.delete(x));
        v.add(value);
      }
      answers[q.id] = q.options.filter(o => v.has(o));
      if (!answers[q.id].length) delete answers[q.id];
    } else {
      // Tapping the chosen answer again on an optional question clears it.
      if (answers[q.id] === value && q.optional) delete answers[q.id];
      else answers[q.id] = value;
      // Departure must not be before arrival.
      const dep = SURVEY_QUESTIONS.find(x => x.notBefore === q.id);
      if (dep && answers[dep.id] && dep.options.indexOf(answers[dep.id]) < dep.options.indexOf(answers[q.id] || '')) delete answers[dep.id];
    }
    if (q.other) {
      const chosen = q.type === 'multi' ? (answers[q.id] || []).includes(q.other) : answers[q.id] === q.other;
      if (!chosen) delete answers[q.id + 'Other'];
    }

    // Reflect the new state in place (no re-render, so animations stay calm).
    const sel = q.type === 'grid' ? [answers[q.id][row.id]] : q.type === 'multi' ? (answers[q.id] || []) : [answers[q.id]];
    $$('.opt', card).forEach(b => b.setAttribute('aria-checked', String(sel.includes(b.dataset.value))));
    if (btn.getAttribute('aria-checked') === 'true') { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }

    const otherWrap = $('#otherWrap', card);
    if (otherWrap) {
      const showOther = sel.includes(q.other);
      otherWrap.hidden = !showOther;
      if (!showOther) $('#otherField', card).value = '';
      if (showOther && value === q.other) setTimeout(() => $('#otherField', card).focus(), 50);
    }
    updateNextBtn();
    save();

    // Single choice moves on by itself, unless it opened an "in your words" box.
    const isSingle = q.type === 'single' || q.type === 'grid';
    if (isSingle && btn.getAttribute('aria-checked') === 'true' && value !== q.other) {
      advanceTimer = setTimeout(() => next(), 340);
    }
  }

  function start() {
    const list = steps();
    const saved = store.get(DRAFT_KEY);
    const resume = saved && saved.cur && list.includes(saved.cur) && saved.cur !== 'intro' ? saved.cur : list[1];
    show(resume, 'next');
  }

  function next() {
    clearTimeout(advanceTimer);
    if (cur === 'intro') return start();
    if (cur === 'review' || cur === 'done') return;
    const card = $('.card:last-child', els.stage);
    const { q, row } = parseKey(cur);
    if (!q.optional && !isAnswered(q, row)) {
      setErr(card, q.type === 'multi' ? 'Pick at least one.' : q.type === 'grid' ? 'Pick one to continue.' : 'Please answer this one.');
      return;
    }
    const list = steps();
    show(list[list.indexOf(cur) + 1] || 'review', 'next');
  }

  function back() {
    clearTimeout(advanceTimer);
    const list = steps();
    const i = list.indexOf(cur);
    if (i > (EMBEDDED ? 1 : 0)) show(list[i - 1], 'prev');
  }

  els.next.addEventListener('click', next);
  els.back.addEventListener('click', back);

  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.altKey) return;
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');

    if (e.key === 'Enter') {
      if (t && t.tagName === 'BUTTON' && !t.classList.contains('opt')) return; // let buttons click themselves
      if (cur === 'intro') { e.preventDefault(); return start(); }
      if (t && t.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return; // newline
      if (cur === 'review' || cur === 'done') return;
      if (t && t.classList.contains('opt') && !e.metaKey && !e.ctrlKey) return; // Enter on an option = select it
      e.preventDefault();
      return next();
    }
    if (typing || e.metaKey || e.ctrlKey) return;
    if (/^[a-j]$/i.test(e.key) && !['intro', 'review', 'done'].includes(cur)) {
      const btn = $$('.card:last-child .opt', els.stage)[LETTERS.indexOf(e.key.toUpperCase())];
      if (btn) { e.preventDefault(); btn.click(); btn.focus({ preventScroll: true }); }
    }
  });

  // ---------- Submit ----------
  async function submit(card) {
    if (sending) return;
    const { answers: clean, errors } = validateSurvey(answers);
    const bad = Object.keys(errors);
    if (bad.length) {
      const q = QBY[bad[0]];
      const key = q.type === 'grid' ? `${q.id}.${(q.rows.find(r => !(clean[q.id] || {})[r.id]) || q.rows[0]).id}` : q.id;
      return show(key, 'prev');
    }

    const btn = $('#sendBtn', card);
    sending = true;
    btn.disabled = true;
    btn.textContent = 'Filing report…';
    setErr(card, '');

    // Stable id, so a retry after a dropped connection isn't counted twice.
    if (!responseId) {
      responseId = Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      save();
    }
    const row = {};
    for (const c of surveyColumns()) row[c.label] = c.get(clean);
    const payload = { id: responseId, version: SURVEY_VERSION, row, answers: clean, website: '' };

    try {
      if (!SUBMIT_URL) {
        console.info('[Tramokyo survey] Preview mode — not saved. Payload:', payload);
        await new Promise(r => setTimeout(r, 700));
      } else {
        // text/plain keeps this a "simple" request, which Apps Script accepts cross-origin.
        const res = await fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'send_failed');
      }
      store.set(DONE_KEY, { id: responseId, at: Date.now() });
      store.del(DRAFT_KEY);
      show('done', 'next');
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Try again →';
      setErr(card, 'Couldn’t send. Your answers are saved on this device, so try again in a moment.');
    } finally {
      sending = false;
    }
  }

  // ---------- Boot ----------
  const done = store.get(DONE_KEY);
  const draft = store.get(DRAFT_KEY);
  if (draft && draft.answers && typeof draft.answers === 'object') {
    answers = draft.answers;
    responseId = draft.responseId || null;
  }
  if (done && !draft) show('done');
  else if (EMBEDDED) start(); // the pop-up opens straight onto a question (or the saved one)
  else show('intro');
</script>
</body>
</html>
